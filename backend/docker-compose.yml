version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL precisa estar configurada no Coolify}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET precisa estar configurada no Coolify}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET precisa estar configurada no Coolify}

      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      ERP_API_KEY: ${ERP_API_KEY:-}
      HK_ERP_API_KEY: ${HK_ERP_API_KEY:-}
      HK_ERP_API_URL: ${HK_ERP_API_URL:-}



